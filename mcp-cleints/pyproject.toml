[project]
name = "mcp-cleints"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ansh Ahuja", email = "anshahuja770@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21",
    "fastmcp>=2.12,<3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
